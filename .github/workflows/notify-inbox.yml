name: GitHub Inbox to Discord

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Restore last check time
        uses: actions/cache/restore@v4
        with:
          path: last_check.txt
          key: inbox-last-check-${{ github.run_id }}
          restore-keys: |
            inbox-last-check-

      - name: Fetch new notifications and relay to Discord
        env:
          GH_TOKEN: ${{ secrets.NOTIFICATIONS_PAT }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_INBOX_WEBHOOK }}
        run: |
          set -e

          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [ -f last_check.txt ]; then
            SINCE=$(cat last_check.txt)
          else
            SINCE=$(date -u -d '10 minutes ago' +"%Y-%m-%dT%H:%M:%SZ")
          fi

          echo "Checking notifications since $SINCE"

          notifications=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/notifications?all=false&since=$SINCE")

          echo "$notifications" | jq -c '.[]' | while read -r n; do
            reason=$(echo "$n" | jq -r '.reason')
            title=$(echo "$n" | jq -r '.subject.title')
            repo=$(echo "$n" | jq -r '.repository.full_name')
            type=$(echo "$n" | jq -r '.subject.type')

            case "$type" in
              PullRequest) icon="PR" ;;
              Issue) icon="Issue" ;;
              Discussion) icon="Discussion" ;;
              Release) icon="Release" ;;
              *) icon="Notif" ;;
            esac

            content=$(jq -n --arg c "[$icon] [$repo] ($reason) $title" '{content: $c}')

            curl -s -H "Content-Type: application/json" -X POST -d "$content" "$DISCORD_WEBHOOK" > /dev/null
            sleep 1
          done

          echo "$NOW" > last_check.txt

      - name: Save last check time
        if: always()
        uses: actions/cache/save@v4
        with:
          path: last_check.txt
          key: inbox-last-check-${{ github.run_id }}

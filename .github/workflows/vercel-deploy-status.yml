name: Vercel Deploy Status to Discord

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Restore deploy state
        uses: actions/cache/restore@v4
        with:
          path: deploy_state.json
          key: deploy-state-${{ github.run_id }}
          restore-keys: |
            deploy-state-

      - name: Check each project and relay new terminal deploys
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECTS: ${{ secrets.VERCEL_PROJECTS }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          set -e
          DEPLOY_CHANNEL_ID="1552982244862464052"
          STATE_FILE=deploy_state.json
          [ -f "$STATE_FILE" ] || echo '{}' > "$STATE_FILE"

          echo "Team ID set: $( [ -n "$VERCEL_TEAM_ID" ] && echo yes || echo NO )"
          echo "Projects string: $VERCEL_PROJECTS"

          IFS=',' read -ra PAIRS <<< "$VERCEL_PROJECTS"
          for pair in "${PAIRS[@]}"; do
            PID="${pair%%:*}"
            NAME="${pair#*:}"
            [ -z "$PID" ] && continue

            echo "--- $NAME ($PID) ---"
            RESP=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$PID&teamId=$VERCEL_TEAM_ID&limit=1")
            echo "Raw response: $RESP"

            DEP=$(echo "$RESP" | jq -c '.deployments[0] // empty')
            if [ -z "$DEP" ]; then
              echo "No deployment found, skipping."
              continue
            fi

            DEP_ID=$(echo "$DEP" | jq -r '.uid')
            STATE=$(echo "$DEP" | jq -r '.state // "UNKNOWN"')
            URL=$(echo "$DEP" | jq -r '.url // empty')
            LAST=$(jq -r --arg p "$PID" '.[$p] // empty' "$STATE_FILE")
            echo "state=$STATE dep_id=$DEP_ID last_seen=$LAST"

            if [ "$DEP_ID" != "$LAST" ] && { [ "$STATE" = "READY" ] || [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; }; then
              case "$STATE" in
                READY) MSG=$(printf '✅ **%s** deployed\nhttps://%s' "$NAME" "$URL") ;;
                ERROR) MSG=$(printf '❌ **%s** deployment failed\nhttps://%s' "$NAME" "$URL") ;;
                CANCELED) MSG="⚪ **$NAME** deployment canceled" ;;
              esac

              echo "Posting to Discord..."
              HTTP_CODE=$(curl -s -o discord_resp.json -w "%{http_code}" -X POST "https://discord.com/api/v10/channels/$DEPLOY_CHANNEL_ID/messages" \
                -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$(jq -n --arg c "$MSG" '{content: $c}')")
              echo "Discord HTTP status: $HTTP_CODE"
              echo "Discord response: $(cat discord_resp.json)"

              tmp=$(jq --arg p "$PID" --arg id "$DEP_ID" '.[$p] = $id' "$STATE_FILE")
              echo "$tmp" > "$STATE_FILE"
              sleep 1
            else
              echo "Nothing new to post."
            fi
          done

      - name: Save deploy state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: deploy_state.json
          key: deploy-state-${{ github.run_id }}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Live Status on life</title>

<!-- Link preview (WhatsApp, Discord, Telegram, iMessage, X...). Crawlers don't run JS,
     so these must be static tags with an absolute image URL. -->
<meta property="og:type" content="website">

<meta property="og:title" content="My Live Status on life">
<meta property="og:description" content="Live Discord status · Wex888">

<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="My Live Status on life">
<meta name="twitter:description" content="Live Discord status · Wex888">
<meta name="twitter:image" content="https://discord-status-web-topaz.vercel.app/api/avatar">

<!-- Browser tab icon + home-screen icon -->
<link rel="icon" type="image/png" href="/api/avatar">
<link rel="apple-touch-icon" href="/api/avatar">
<style>
  :root {
    --bg: #050505;
    --text: #f5f4f1;
    --text-dim: rgba(245,244,241,0.62);
    --online: #3ba55d;
    --idle: #e8a33d;
    --dnd: #ed4245;
    --offline: #8a8a92;
    --accent: #7c6fff;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  /* ---- Full-page background video ---- */
  .page-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    filter: saturate(1.08) contrast(1.04);
  }

  /* Vignette */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0) 38%, rgba(0,0,0,0.55) 92%, rgba(0,0,0,0.8) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0) 78%, rgba(0,0,0,0.5) 100%);
  }

  /* Comic-style motion streaks, radiating faintly from center */
  .motion-streaks {
    position: fixed;
    inset: -10%;
    z-index: 1;
    pointer-events: none;
    opacity: 0.16;
    mix-blend-mode: overlay;
    background: repeating-conic-gradient(
      from 0deg,
      rgba(255,255,255,0.9) 0deg 0.4deg,
      transparent 0.4deg 6deg
    );
    -webkit-mask-image: radial-gradient(circle at center, transparent 20%, black 62%, black 100%);
    mask-image: radial-gradient(circle at center, transparent 20%, black 62%, black 100%);
    filter: blur(1.5px);
  }

  .video-placeholder {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: rgba(255,255,255,0.35);
    background: radial-gradient(circle at center, #1a1a2e 0%, #0c0c12 100%);
  }

  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }

  /* ---- Top-left "Online" status pill (liquid glass) ---- */
  .status-pill {
    position: fixed;
    top: calc(20px + env(safe-area-inset-top, 0px));
    left: 20px;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 16px 9px 13px;
    border-radius: 999px;
    isolation: isolate;

    background:
      radial-gradient(circle at 25% 20%, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.07) 30%, rgba(255,255,255,0) 55%),
      rgba(255,255,255,0.08);
    backdrop-filter: blur(18px) saturate(1.6);
    -webkit-backdrop-filter: blur(18px) saturate(1.6);
    border: 1px solid rgba(255,255,255,0.32);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.55),
      inset 0 -6px 10px -6px rgba(0,0,0,0.35),
      0 10px 24px -8px rgba(0,0,0,0.5),
      0 2px 6px rgba(0,0,0,0.28);
  }

  .status-pill::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 70%, rgba(255,255,255,0.15) 100%);
    mix-blend-mode: overlay;
    pointer-events: none;
  }

  .status-pill .dot-inline {
    position: relative;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--offline);
    flex-shrink: 0;
    z-index: 1;
  }

  .status-pill .dot-inline.pulse::before {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: inherit;
    opacity: 0.5;
    animation: pulse 2s ease-out infinite;
  }

  .status-pill span#statusText {
    position: relative;
    z-index: 1;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-shadow: 0 1px 6px rgba(0,0,0,0.4);
  }

  @keyframes pulse {
    0% { transform: scale(0.9); opacity: 0.5; }
    100% { transform: scale(1.9); opacity: 0; }
  }

  /* ---- Floating identity, no card ---- */
  .identity {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
  }

  .avatar-wrap {
    position: relative;
    width: 132px;
    height: 132px;
    filter: drop-shadow(0 12px 40px rgba(0,0,0,0.65));
  }

  .avatar-wrap img#avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.18);
    background: #141418;
    display: block;
    object-fit: cover;
  }

  .avatar-decoration {
    position: absolute;
    top: -13%;
    left: -13%;
    width: 126%;
    height: 126%;
    pointer-events: none;
    display: none;
  }

  .avatar-decoration.show { display: block; }

  .status-dot {
    position: absolute;
    bottom: 4px;
    right: 4px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 4px solid var(--bg);
    background: var(--offline);
    transition: background 0.3s ease;
  }

  .status-dot.pulse::before {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: inherit;
    opacity: 0.5;
    animation: pulse 2s ease-out infinite;
  }

  .name-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.6);
  }

  .display-name {
    font-size: 26px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }

  .username {
    font-size: 14px;
    color: var(--text-dim);
  }

  .error-banner {
    margin-top: 4px;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(237,66,69,0.14);
    border: 1px solid rgba(237,66,69,0.3);
    color: #ff9698;
    font-size: 11.5px;
    display: none;
  }

  .error-banner.show { display: block; }

  /* ---- Custom tag pill (set from Discord with /tag, stored in Lanyard KV) ---- */
  .tag-pill {
    display: none;
    position: relative;
    margin-top: 8px;
    padding: 6px 14px;
    max-width: 260px;
    border-radius: 999px;
    isolation: isolate;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 6px rgba(0,0,0,0.4);

    background:
      radial-gradient(circle at 25% 20%, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.07) 30%, rgba(255,255,255,0) 55%),
      rgba(255,255,255,0.08);
    backdrop-filter: blur(18px) saturate(1.6);
    -webkit-backdrop-filter: blur(18px) saturate(1.6);
    border: 1px solid rgba(255,255,255,0.32);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.55),
      inset 0 -6px 10px -6px rgba(0,0,0,0.35),
      0 10px 24px -8px rgba(0,0,0,0.5),
      0 2px 6px rgba(0,0,0,0.28);
  }

  /* inline-block (not flex) so text-overflow: ellipsis works on long tags */
  .tag-pill.show { display: inline-block; }

  /* ---- Mute toggle ---- */
  .mute-btn {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    right: 20px;
    z-index: 3;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(13,13,16,0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    transition: background 0.2s ease, transform 0.15s ease;
  }

  .mute-btn:hover { background: rgba(20,20,24,0.7); }
  .mute-btn:active { transform: scale(0.94); }
  .mute-btn svg { width: 20px; height: 20px; }

  /* ---- Social links: iOS "Liquid Glass" buttons ---- */
  .social-dock {
    position: relative;
    z-index: 2;
    display: flex;
    gap: 12px;
    margin-top: 2px;
  }

  .liquid-btn {
    position: relative;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: var(--text);
    cursor: pointer;
    isolation: isolate;

    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.08) 32%, rgba(255,255,255,0) 55%),
      rgba(255,255,255,0.08);
    backdrop-filter: blur(18px) saturate(1.6);
    -webkit-backdrop-filter: blur(18px) saturate(1.6);
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.6),
      inset 0 -6px 10px -6px rgba(0,0,0,0.35),
      0 10px 24px -8px rgba(0,0,0,0.55),
      0 2px 6px rgba(0,0,0,0.3);

    transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.28s ease,
                background 0.28s ease;
  }

  .liquid-btn::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 28%, rgba(255,255,255,0) 72%, rgba(255,255,255,0.18) 100%);
    mix-blend-mode: overlay;
    pointer-events: none;
  }

  .liquid-btn::after {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 50%;
    padding: 1px;
    background: conic-gradient(from 200deg, rgba(255,255,255,0.05), rgba(255,255,255,0.65) 15%, rgba(255,255,255,0.05) 35%, rgba(255,255,255,0.05) 65%, rgba(255,255,255,0.45) 85%, rgba(255,255,255,0.05));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    opacity: 0.9;
  }

  .liquid-btn svg {
    width: 17px;
    height: 17px;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
  }

  .liquid-btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.7),
      inset 0 -6px 10px -6px rgba(0,0,0,0.35),
      0 16px 32px -10px rgba(0,0,0,0.6),
      0 4px 10px rgba(0,0,0,0.35);
  }

  .liquid-btn:active {
    transform: translateY(-1px) scale(0.93);
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,0.25),
      inset 0 1px 1px rgba(255,255,255,0.4),
      0 6px 14px -6px rgba(0,0,0,0.5);
  }

  /* ---- Activity / Spotify block: liquid glass, wider + taller, below the dock ---- */
  .activity {
    position: relative;
    z-index: 2;
    margin-top: 4px;
    width: 100%;
    max-width: 360px;
    min-width: 300px;
    padding: 16px 18px;
    border-radius: 26px;
    display: none;
    flex-direction: column;
    gap: 12px;
    isolation: isolate;

    background:
      radial-gradient(circle at 25% 15%, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.07) 30%, rgba(255,255,255,0) 55%),
      rgba(255,255,255,0.07);
    backdrop-filter: blur(20px) saturate(1.6);
    -webkit-backdrop-filter: blur(20px) saturate(1.6);
    border: 1px solid rgba(255,255,255,0.32);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.55),
      inset 0 -6px 10px -6px rgba(0,0,0,0.35),
      0 14px 30px -10px rgba(0,0,0,0.55),
      0 2px 8px rgba(0,0,0,0.3);
  }

  .activity::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 26px;
    background: linear-gradient(135deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 70%, rgba(255,255,255,0.15) 100%);
    mix-blend-mode: overlay;
    pointer-events: none;
  }

  .activity::after {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 26px;
    padding: 1px;
    background: conic-gradient(from 200deg, rgba(255,255,255,0.04), rgba(255,255,255,0.5) 15%, rgba(255,255,255,0.04) 35%, rgba(255,255,255,0.04) 65%, rgba(255,255,255,0.35) 85%, rgba(255,255,255,0.04));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    opacity: 0.9;
  }

  .activity.show { display: flex; }

  .activity-top {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 13px;
    align-items: center;
  }

  .activity img {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    object-fit: cover;
    flex-shrink: 0;
    background: #1c1c22;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }

  .activity-text {
    min-width: 0;
    text-align: left;
    flex: 1;
  }

  .activity-kind {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 3px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .activity-kind svg {
    width: 11px;
    height: 11px;
    flex-shrink: 0;
  }

  .activity-name {
    font-size: 14.5px;
    font-weight: 650;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    text-shadow: 0 1px 6px rgba(0,0,0,0.35);
  }

  .activity-detail {
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    margin-top: 1px;
  }

  /* ---- Playback progress (Spotify: real elapsed time; other activities: hidden) ---- */
  .activity-progress {
    position: relative;
    z-index: 1;
    display: none;
    flex-direction: column;
    gap: 6px;
  }

  .activity-progress.show { display: flex; }

  .progress-track {
    position: relative;
    width: 100%;
    height: 4px;
    border-radius: 999px;
    background: rgba(255,255,255,0.18);
    overflow: hidden;
  }

  .progress-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(255,255,255,0.95), rgba(255,255,255,0.75));
    box-shadow: 0 0 8px rgba(255,255,255,0.4);
    transition: width 0.9s linear;
  }

  .progress-times {
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
    letter-spacing: 0.01em;
  }

  .error-banner {
    margin-top: 4px;
  }

  /* ---- GitHub activity block: same liquid-glass treatment, independent of Discord ---- */
  .github-activity {
    position: relative;
    z-index: 2;
    margin-top: 4px;
    width: 100%;
    max-width: 360px;
    min-width: 300px;
    padding: 14px 18px;
    border-radius: 22px;
    display: none;
    gap: 12px;
    align-items: center;
    isolation: isolate;

    background:
      radial-gradient(circle at 25% 15%, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.07) 30%, rgba(255,255,255,0) 55%),
      rgba(255,255,255,0.07);
    backdrop-filter: blur(20px) saturate(1.6);
    -webkit-backdrop-filter: blur(20px) saturate(1.6);
    border: 1px solid rgba(255,255,255,0.32);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.55),
      inset 0 -6px 10px -6px rgba(0,0,0,0.35),
      0 14px 30px -10px rgba(0,0,0,0.55),
      0 2px 8px rgba(0,0,0,0.3);
    text-decoration: none;
    color: var(--text);
    cursor: pointer;
  }

  .github-activity::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 22px;
    background: linear-gradient(135deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 70%, rgba(255,255,255,0.15) 100%);
    mix-blend-mode: overlay;
    pointer-events: none;
  }

  .github-activity::after {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 22px;
    padding: 1px;
    background: conic-gradient(from 200deg, rgba(255,255,255,0.04), rgba(255,255,255,0.5) 15%, rgba(255,255,255,0.04) 35%, rgba(255,255,255,0.04) 65%, rgba(255,255,255,0.35) 85%, rgba(255,255,255,0.04));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    opacity: 0.9;
  }

  .github-activity.show { display: flex; }

  .github-activity:hover {
    transform: translateY(-2px);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.65),
      inset 0 -6px 10px -6px rgba(0,0,0,0.35),
      0 18px 36px -10px rgba(0,0,0,0.6),
      0 4px 10px rgba(0,0,0,0.35);
  }

  .github-activity:active { transform: translateY(0) scale(0.98); }

  .github-activity-icon {
    position: relative;
    z-index: 1;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .github-activity-icon svg {
    width: 20px;
    height: 20px;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
  }

  .github-activity-text {
    min-width: 0;
    text-align: left;
    flex: 1;
  }

  .github-activity-kind {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 3px;
  }

  .github-activity-name {
    font-size: 13.5px;
    font-weight: 650;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    text-shadow: 0 1px 6px rgba(0,0,0,0.35);
  }

  .github-activity-detail {
    font-size: 11.5px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    margin-top: 1px;
  }

  .github-activity-time {
    position: relative;
    z-index: 1;
    font-size: 10px;
    color: var(--text-dim);
    flex-shrink: 0;
    align-self: flex-start;
    margin-top: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .liquid-btn { transition: none; }
    .status-dot.pulse::before { animation: none; }
    .status-pill .dot-inline.pulse::before { animation: none; }
    .progress-fill { transition: none; }
    .github-activity { transition: none; }
  }
</style>
</head>
<body>

  <!-- Swap src below for your own video file -->
  <video class="page-video" id="bgVideo" loop playsinline>
    <source src="YOUR_VIDEO_FILE.mp4" type="video/mp4">
  </video>
  <div class="motion-streaks"></div>
  <div class="vignette"></div>
  <div class="video-placeholder" id="videoPlaceholder">drop your video in as the page bg — see comment in code</div>

  <!-- Top-left Online status pill -->
  <div class="status-pill">
    <span class="dot-inline" id="statusDotInline"></span>
    <span id="statusText">connecting…</span>

<script>
  // ==== SET YOUR DISCORD USER ID HERE ====
  const DISCORD_USER_ID = "1382308851814240298";
  // ========================================

  const STATUS_COLORS = {
    online: 'var(--online)',
    idle: 'var(--idle)',
    dnd: 'var(--dnd)',
    offline: 'var(--offline)'
  };
  const STATUS_LABELS = {
    online: 'Online',
    idle: 'Idle',
    dnd: 'Do Not Disturb',
    offline: 'Offline'
  };
  const ACTIVITY_TYPE_LABELS = {
    0: 'Playing',
    1: 'Streaming',
    2: 'Listening to',
    3: 'Watching',
    4: 'Status',
    5: 'Competing in'
  };

  const el = (id) => document.getElementById(id);

  function showError(msg) {
    const banner = el('errorBanner');
    banner.textContent = msg;
    banner.classList.add('show');
  }

  function applyStatus(status) {
    const color = STATUS_COLORS[status] || STATUS_COLORS.offline;
    const dot = el('statusDot');
    dot.style.background = color;
    dot.classList.toggle('pulse', status === 'online');
    const dotInline = el('statusDotInline');
    dotInline.style.background = color;
    dotInline.classList.toggle('pulse', status === 'online');
    el('statusText').textContent = STATUS_LABELS[status] || 'Offline';
  }

  function formatTime(ms) {
    if (!Number.isFinite(ms) || ms < 0) ms = 0;
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return `${m}:${s.toString().padStart(2, '0')}`;
  }

  // Live-updating playback tracker so the progress bar/elapsed time moves
  // smoothly between the 10s Lanyard polls instead of jumping.
  let progressTimer = null;
  let currentTrack = { start: null, end: null };

  // Discord's gateway can momentarily omit the Spotify/activities payload on a
  // status transition (e.g. Online -> Idle) even though the song is still
  // playing -- Lanyard just mirrors whatever Discord last sent it. Rather than
  // hide the whole card the instant that happens, remember the last-known
  // Spotify/activity data and keep showing it through a short grace window so
  // a blip doesn't make the card flicker away.
  let lastKnownActivityAt = 0;
  const ACTIVITY_GRACE_MS = 25000; // a bit over 2 missed 10s polls

  function stopProgressTicker() {
    if (progressTimer) {
      clearInterval(progressTimer);
      progressTimer = null;
    }
    el('activityProgress').classList.remove('show');
  }

  function tickProgress() {
    const { start, end } = currentTrack;
    if (!start || !end) return;
    const now = Date.now();
    const total = end - start;
    const elapsed = Math.min(Math.max(now - start, 0), total);
    const pct = total > 0 ? (elapsed / total) * 100 : 0;
    el('progressFill').style.width = pct + '%';
    el('progressElapsed').textContent = formatTime(elapsed);
    el('progressTotal').textContent = formatTime(total);
  }

  function startProgressTicker(startMs, endMs) {
    currentTrack = { start: startMs, end: endMs };
    el('activityProgress').classList.add('show');
    tickProgress();
    if (progressTimer) clearInterval(progressTimer);
    progressTimer = setInterval(tickProgress, 1000);
  }

  function applyActivity(activities, spotify) {
    const block = el('activityBlock');
    const kindIcon = el('activityKindIcon');

    if (spotify) {
      lastKnownActivityAt = Date.now();
      block.classList.add('show');
      kindIcon.style.display = 'block';
      el('activityKind').textContent = 'Listening to Spotify';
      el('activityName').textContent = spotify.song || 'Unknown track';
      el('activityDetail').textContent = spotify.artist || '';
      el('activityImg').src = spotify.album_art_url || '';

      const ts = spotify.timestamps;
      if (ts && ts.start && ts.end) {
        startProgressTicker(ts.start, ts.end);
      } else {
        stopProgressTicker();
      }
      return;
    }

    const act = (activities || []).find(a => a.type !== 4) || (activities || [])[0];
    if (!act) {
      // No activity in this poll. If we showed one very recently, treat it as
      // a momentary gap from Discord's gateway (e.g. right after a status
      // change like Online -> Idle) rather than the activity actually having
      // ended, and keep the card up until the grace window elapses.
      const withinGrace = lastKnownActivityAt && (Date.now() - lastKnownActivityAt) < ACTIVITY_GRACE_MS;
      if (!withinGrace) {
        block.classList.remove('show');
        stopProgressTicker();
      }
      return;
    }

    lastKnownActivityAt = Date.now();
    block.classList.add('show');
    kindIcon.style.display = 'none';
    el('activityKind').textContent = ACTIVITY_TYPE_LABELS[act.type] || 'Activity';
    el('activityName').textContent = act.name || '—';
    el('activityDetail').textContent = act.details || act.state || '';

    if (act.assets && act.assets.large_image) {
      let img = act.assets.large_image;
      if (img.startsWith('mp:external/')) {
        img = 'https://media.discordapp.net/external/' + img.split('mp:external/')[1];
      } else {
        img = `https://cdn.discordapp.com/app-assets/${act.application_id}/${img}.png`;
      }
      el('activityImg').src = img;
    } else {
      el('activityImg').src = '';
    }

    // Some Rich Presence activities (games, etc.) report elapsed-only timestamps.
    if (act.timestamps && act.timestamps.start && act.timestamps.end) {
      startProgressTicker(act.timestamps.start, act.timestamps.end);
    } else if (act.timestamps && act.timestamps.start) {
      // Elapsed-only: show a running clock with no fixed end.
      el('activityProgress').classList.add('show');
      const startMs = act.timestamps.start;
      const render = () => {
        const elapsed = Date.now() - startMs;
        el('progressFill').style.width = '100%';
        el('progressElapsed').textContent = formatTime(elapsed);
        el('progressTotal').textContent = '';
      };
      render();
      if (progressTimer) clearInterval(progressTimer);
      progressTimer = setInterval(render, 1000);
      currentTrack = { start: null, end: null };
    } else {
      stopProgressTicker();
    }
  }

  function applyUser(user) {
    if (!user) return;
    const display = user.global_name || user.username || 'Unknown';
    el('displayName').textContent = display;
    el('username').textContent = '@' + (user.username || '—');
    const avatarUrl = user.avatar
      ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${user.avatar.startsWith('a_') ? 'gif' : 'png'}?size=256`
      : `https://cdn.discordapp.com/embed/avatars/0.png`;
    el('avatar').src = avatarUrl;

    const decoImg = el('avatarDecoration');
    const asset = user.avatar_decoration_data && user.avatar_decoration_data.asset;
    if (asset) {
      // Decoration assets are almost always animated — try gif first, fall back to png if it 404s.
      decoImg.onerror = () => {
        decoImg.onerror = () => decoImg.classList.remove('show');
        decoImg.src = `https://cdn.discordapp.com/avatar-decoration-presets/${asset}.png?size=256`;
      };
      decoImg.src = `https://cdn.discordapp.com/avatar-decoration-presets/${asset}.gif?size=256`;
      decoImg.classList.add('show');
    } else {
      decoImg.classList.remove('show');
    }
  }

  // Custom tag: set from Discord with /tag, stored in Lanyard's KV store under the
  // key "tag" and returned by Lanyard as d.kv.tag. It doesn't depend on your online
  // status, so it still shows while you're offline or invisible.
  function applyTag(kv) {
    const pill = el('tagPill');
    const raw = kv && typeof kv.tag === 'string' ? kv.tag.trim() : '';
    if (raw) {
      pill.textContent = raw.slice(0, 40);
      pill.classList.add('show');
    } else {
      pill.textContent = '';
      pill.classList.remove('show');
    }
  }

  async function fetchPresence() {
    if (!DISCORD_USER_ID || DISCORD_USER_ID === 'YOUR_DISCORD_ID') {
      showError('Add your Discord User ID in the script to go live.');
      applyStatus('offline');
      return;
    }
    try {
      const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`);
      const json = await res.json();
      if (!json.success) {
        showError('Lanyard couldn\'t find this user. Make sure you\'ve joined the Lanyard Discord server.');
        applyStatus('offline');
        return;
      }
      el('errorBanner').classList.remove('show');
      const d = json.data;
      applyUser(d.discord_user);
      applyStatus(d.discord_status);
      applyActivity(d.activities, d.listening_to_spotify ? d.spotify : null);
      applyTag(d.kv);
    } catch (e) {
      showError('Connection to Lanyard failed. Retrying…');
      applyStatus('offline');
    }
  }

  // ---- Video + audio-on-by-default handling ----
  const video = el('bgVideo');
  const placeholder = el('videoPlaceholder');
  const muteBtn = el('muteBtn');
  const muteIcon = el('muteIcon');

  const ICON_UNMUTED = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>';
  const ICON_MUTED = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>';

  function syncMuteIcon() {
    muteIcon.innerHTML = video.muted ? ICON_MUTED : ICON_UNMUTED;
    muteBtn.setAttribute('aria-label', video.muted ? 'Unmute background video' : 'Mute background video');
  }

  video.addEventListener('loadeddata', () => placeholder.style.display = 'none');
  video.addEventListener('error', () => placeholder.style.display = 'flex');

  // Try to autoplay WITH sound first (default request). Most browsers block this
  // without prior interaction, so if it fails, fall back to muted autoplay and
  // let the mute button turn sound on with one tap.
  video.muted = false;
  video.play().then(() => {
    syncMuteIcon();
  }).catch(() => {
    video.muted = true;
    video.play().catch(() => {});
    syncMuteIcon();
  });

  muteBtn.addEventListener('click', () => {
    video.muted = !video.muted;
    if (!video.muted) video.play().catch(() => {});
    syncMuteIcon();
  });

  fetchPresence();
  setInterval(fetchPresence, 10000);

  // ---- GitHub activity (Option C: direct from GitHub's API, no Discord involved) ----
  const GITHUB_USERNAME = 'heyitsaadin';

  const GH_EVENT_LABELS = {
    PushEvent: 'Pushed to',
    PullRequestEvent: 'Pull request',
    IssuesEvent: 'Issue',
    IssueCommentEvent: 'Commented on',
    CreateEvent: 'Created',
    DeleteEvent: 'Deleted',
    ForkEvent: 'Forked',
    WatchEvent: 'Starred',
    ReleaseEvent: 'Released',
    PublicEvent: 'Open-sourced'
  };

  function timeAgo(dateStr) {
    const diffMs = Date.now() - new Date(dateStr).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    if (days < 30) return `${days}d ago`;
    const months = Math.floor(days / 30);
    return `${months}mo ago`;
  }

  function describeGithubEvent(evt) {
    const repo = evt.repo && evt.repo.name ? evt.repo.name.split('/').pop() : 'a repo';
    const kind = GH_EVENT_LABELS[evt.type] || evt.type.replace('Event', '');

    switch (evt.type) {
      case 'PushEvent': {
        const payload = evt.payload || {};
        const commits = payload.commits;
        // GitHub's events API can return an empty/truncated `commits` array
        // even when the push had real commits -- `distinct_size` (falling
        // back to `size`) is the field that reliably reflects the actual
        // commit count, so use that instead of commits.length.
        const n = typeof payload.distinct_size === 'number'
          ? payload.distinct_size
          : (typeof payload.size === 'number' ? payload.size : (commits ? commits.length : 0));
        const lastMsg = commits && commits.length > 0 ? commits[commits.length - 1].message.split('\n')[0] : '';
        // payload.ref looks like "refs/heads/main" -- strip it down to the branch name
        const branch = payload.ref ? payload.ref.replace(/^refs\/heads\//, '') : '';
        const countText = n > 0 ? `${n} commit${n === 1 ? '' : 's'}` : '';
        // "where it pushed": repo name is the card title, branch goes in the detail line
        const parts = [];
        if (branch) parts.push(`on ${branch}`);
        if (lastMsg) parts.push(lastMsg);
        else if (countText) parts.push(countText);
        return { kind, name: repo, detail: parts.join(' · ') };
      }
      case 'PullRequestEvent': {
        const action = evt.payload && evt.payload.action;
        const title = evt.payload && evt.payload.pull_request && evt.payload.pull_request.title;
        return { kind: `PR ${action || ''}`.trim(), name: repo, detail: title || '' };
      }
      case 'IssuesEvent': {
        const action = evt.payload && evt.payload.action;
        const title = evt.payload && evt.payload.issue && evt.payload.issue.title;
        return { kind: `Issue ${action || ''}`.trim(), name: repo, detail: title || '' };
      }
      case 'IssueCommentEvent': {
        const title = evt.payload && evt.payload.issue && evt.payload.issue.title;
        return { kind, name: repo, detail: title || '' };
      }
      case 'CreateEvent': {
        const refType = evt.payload && evt.payload.ref_type;
        return { kind: `Created ${refType || ''}`.trim(), name: repo, detail: (evt.payload && evt.payload.ref) || '' };
      }
      case 'ReleaseEvent': {
        const tag = evt.payload && evt.payload.release && evt.payload.release.tag_name;
        return { kind, name: repo, detail: tag || '' };
      }
      default:
        return { kind, name: repo, detail: '' };
    }
  }

  // The card behaves like a transient notification: it shows the single most
  // recent public GitHub event only while that event is younger than
  // GITHUB_DISPLAY_MS, measured from the event's real created_at timestamp
  // (NOT from when the page loaded). Older events are never shown, so opening
  // the page long after a push shows nothing.
  const GITHUB_DISPLAY_MS = 30000; // visible for 30s after the push happened
  let currentGithubEventId = null;
  let githubHideTimer = null;
  let githubBackoffUntil = 0; // epoch ms; while Date.now() < this, skip GitHub requests

  async function fetchGithubActivity() {
    const block = el('githubActivityBlock');
    if (Date.now() < githubBackoffUntil) return; // rate limited, wait for reset
    try {
      const res = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/events/public?per_page=1`);
      if (res.status === 403 || res.status === 429) {
        // Rate limited. x-ratelimit-reset is a unix timestamp (seconds) for when
        // the limit resets; fall back to 5 minutes if the header is missing.
        const reset = parseInt(res.headers.get('x-ratelimit-reset'), 10);
        githubBackoffUntil = Number.isFinite(reset) ? reset * 1000 : Date.now() + 5 * 60000;
        return;
      }
      if (!res.ok) return;
      const events = await res.json();
      if (!Array.isArray(events) || events.length === 0) return;

      const evt = events[0];

      // How old is this event, measured from when it ACTUALLY happened on GitHub
      // (not from when this page loaded). This is what makes the card go away.
      const ageMs = Date.now() - new Date(evt.created_at).getTime();
      const remainingMs = GITHUB_DISPLAY_MS - ageMs;

      // Too old (or clock skew made it nonsense): make sure the card is hidden.
      if (remainingMs <= 0) {
        if (githubHideTimer) { clearTimeout(githubHideTimer); githubHideTimer = null; }
        block.classList.remove('show');
        return;
      }

      // Fresh push. Render it (only re-render when it's a new event to avoid flicker).
      if (evt.id !== currentGithubEventId) {
        currentGithubEventId = evt.id;

        const { kind, name, detail } = describeGithubEvent(evt);
        el('githubActivityKind').textContent = kind;
        el('githubActivityName').textContent = name;
        el('githubActivityDetail').textContent = detail;
        block.href = `https://github.com/${evt.repo && evt.repo.name ? evt.repo.name : GITHUB_USERNAME}`;
      }

      el('githubActivityTime').textContent = timeAgo(evt.created_at);
      block.classList.add('show');

      // Hide exactly when the event turns 30s old, based on its real timestamp.
      if (githubHideTimer) clearTimeout(githubHideTimer);
      githubHideTimer = setTimeout(() => {
        block.classList.remove('show');
      }, remainingMs);
    } catch (e) {
      // Fail quietly -- this block is a bonus, not core to the page.
    }
  }

  fetchGithubActivity();

  // GitHub's unauthenticated API allows 60 requests/hour PER VISITOR IP. Poll every
  // 30s (120/hr) is over budget, so we poll every 60s (60/hr) while the tab is
  // visible, skip polling while it's hidden, and re-check immediately when the
  // tab comes back. If GitHub still rate-limits us, githubBackoffUntil pauses
  // polling until the limit resets (see fetchGithubActivity).
  setInterval(() => {
    if (document.hidden) return;
    fetchGithubActivity();
  }, 60000);

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) fetchGithubActivity();
  });
</script>

</body>
</html>
